name: Temporary test output diagnostics

on:
  push:
    branches:
      - fix/deals-fetch-resilience-2026-10-30

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture complete npm test output
        run: |
          set +e
          npm test > npm-test-output.log 2>&1
          status=$?
          echo "NPM_TEST_EXIT_CODE=$status" >> npm-test-output.log
          cat npm-test-output.log
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-npm-test-output
          path: npm-test-output.log
          if-no-files-found: error
          retention-days: 1
