name: Live SnapFlyer Catalog Text Extraction

on:
  push:
    branches:
      - fix/deals-fetch-resilience-2026-10-30
    paths:
      - "tests/snapflyer-catalog-deals-live.js"
      - "modules/snapflyer-catalog-deals.js"
      - "modules/catalog-newsletter.js"
      - "modules/catalog-newsletter-scheduler.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-catalog-text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Run live text extraction for the three agreed stores
        run: node tests/snapflyer-catalog-deals-live.js
