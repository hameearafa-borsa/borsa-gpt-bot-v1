name: Live SnapFlyer Product Image OCR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-product-image-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Arabic and English Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs
      - name: Install project dependencies
        run: npm ci
      - name: Run complete static and automated test suite
        run: npm run check && npm test
      - name: Discover relevant products from all three live store pages
        run: node tests/catalog-product-discovery-live.js
      - name: Run live individual-product image OCR
        run: node tests/catalog-product-image-ocr-live.js
