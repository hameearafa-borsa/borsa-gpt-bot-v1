name: Pass17 checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/pass17-owner-panel-deal-alert-dedupe", "feature/guided-price-review-edit-2026-10-29"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Run test suite
        run: npm test
